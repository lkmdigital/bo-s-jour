# Config Nginx pour le conteneur backend — même structure que le stack Nginx+PHP-FPM
# monté en local le 2026-08-31 pour les tests de charge k6 (voir
# backend/tests/load/README.md), adaptée pour tourner en conteneur (php-fpm
# comme service séparé, pas un socket/port sur 127.0.0.1).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri =404;
    }
}
