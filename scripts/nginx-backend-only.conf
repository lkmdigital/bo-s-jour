# Configuration Nginx pour le BACKEND uniquement
# À ajouter sur un serveur où le frontend est déjà en ligne
#
# Option 1: Sous-domaine API (apimonbeaupays.loyerpay.ci)
# Option 2: Même domaine avec /api -> backend
#
# Placer dans: /etc/nginx/sites-available/monbeaupays-api
# Puis: ln -s /etc/nginx/sites-available/monbeaupays-api /etc/nginx/sites-enabled/

# ========== Option 1: Sous-domaine dédié à l'API ==========
server {
    listen 80;
    server_name apimonbeaupays.loyerpay.ci;
    
    root /var/www/monbeaupays-backend/public;
    index index.php index.html;

    client_max_body_size 20M;

    access_log /var/log/nginx/monbeaupays-api-access.log;
    error_log /var/log/nginx/monbeaupays-api-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location /storage {
        alias /var/www/monbeaupays-backend/storage/app/public;
    }
}
