# Configuration Nginx pour MonBeauPays (Backend + Frontend sur le même serveur)
# À placer dans: /etc/nginx/sites-available/monbeaupays
# Puis: ln -s /etc/nginx/sites-available/monbeaupays /etc/nginx/sites-enabled/

# Redirection HTTP -> HTTPS (si SSL configuré)
# server {
#     listen 80;
#     server_name monbeaupays.loyerpay.ci apimonbeaupays.loyerpay.ci;
#     return 301 https://$host$request_uri;
# }

# Backend API (Laravel) - /api
server {
    listen 80;
    server_name apimonbeaupays.loyerpay.ci;
    
    root /var/www/monbeaupays-backend/public;
    index index.php index.html;

    client_max_body_size 20M;

    access_log /var/log/nginx/monbeaupays-api-access.log;
    error_log /var/log/nginx/monbeaupays-api-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location /storage {
        alias /var/www/monbeaupays-backend/storage/app/public;
    }
}

# Frontend (Next.js) - site principal
server {
    listen 80;
    server_name monbeaupays.loyerpay.ci;

    client_max_body_size 20M;

    access_log /var/log/nginx/monbeaupays-frontend-access.log;
    error_log /var/log/nginx/monbeaupays-frontend-error.log;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }
}

