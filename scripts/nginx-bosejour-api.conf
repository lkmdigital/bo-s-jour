# Configuration Nginx - API Bosejour (api.bosejour.ci)
# Sous-domaine pointant vers le backend Laravel
#
# Installation sur le serveur:
#   scp scripts/nginx-bosejour-api.conf root@72.62.31.145:/tmp/
#   ssh root@72.62.31.145
#   sudo cp /tmp/nginx-bosejour-api.conf /etc/nginx/sites-available/bosejour-api
#   sudo ln -sf /etc/nginx/sites-available/bosejour-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (Let's Encrypt):
#   sudo certbot --nginx -d api.bosejour.ci

server {
    listen 80;
    server_name api.bosejour.ci;

    root /var/www/monbeaupays-backend/public;
    index index.php index.html;

    client_max_body_size 20M;

    access_log /var/log/nginx/bosejour-api-access.log;
    error_log /var/log/nginx/bosejour-api-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location /storage {
        alias /var/www/monbeaupays-backend/storage/app/public;
    }
}
